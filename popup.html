<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    /* ═══════════════ Design Tokens — shadcn/ui ═══════════════ */
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 3.9%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 3.9%;
      --muted: 240 4.8% 95.9%;
      --muted-foreground: 240 3.8% 46.1%;
      --primary: 240 5.9% 10%;
      --primary-foreground: 0 0% 98%;
      --secondary: 240 4.8% 95.9%;
      --secondary-foreground: 240 5.9% 10%;
      --accent: 240 4.8% 95.9%;
      --accent-foreground: 240 5.9% 10%;
      --destructive: 0 84.2% 60.2%;
      --border: 240 5.9% 90%;
      --input: 240 5.9% 90%;
      --ring: 240 5% 64.9%;
      --radius: 0.625rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --card: 240 10% 3.9%;
        --card-foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --primary: 0 0% 98%;
        --primary-foreground: 240 5.9% 10%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --accent: 240 3.7% 15.9%;
        --accent-foreground: 0 0% 98%;
        --border: 240 3.7% 15.9%;
        --input: 240 3.7% 15.9%;
        --ring: 240 4.9% 83.9%;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      padding: 10px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* ═══════════════ 卡片基元 ═══════════════ */
    .card {
      background: hsl(var(--card));
      color: hsl(var(--card-foreground));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    /* ═══════════════ 头部 ═══════════════ */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: block;
    }
    .brand-mark svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
    }
    .header .sub {
      font-size: 11px;
      color: hsl(var(--muted-foreground));
      margin-top: 1px;
      line-height: 1.3;
    }

    /* ═══════════════ 页面信息 ═══════════════ */
    .info {
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      color: hsl(var(--muted-foreground));
      line-height: 1.55;
    }
    .info .title {
      color: hsl(var(--foreground));
      font-weight: 500;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 2px;
    }

    /* ═══════════════ 操作按钮 ═══════════════ */
    .btn-group { display: flex; flex-direction: column; gap: 6px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      width: 100%;
      height: 34px;
      padding: 0 12px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: hsl(var(--secondary-foreground));
      background: hsl(var(--card));
      border: 1px solid hsl(var(--border));
      border-radius: calc(var(--radius) - 2px);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.15s ease, color 0.15s ease,
        border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:hover {
      background: hsl(var(--accent));
      color: hsl(var(--accent-foreground));
    }
    .btn:active { background: hsl(var(--accent) / 0.8); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
    .btn:focus-visible {
      outline: none;
      border-color: hsl(var(--ring));
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring) / 0.4);
    }
    .btn-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      color: hsl(var(--muted-foreground));
    }
    .btn:hover .btn-icon { color: hsl(var(--accent-foreground)); }
    .btn-label { flex: 1; min-width: 0; }
    /* 主按钮 */
    .btn.primary {
      background: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
      font-weight: 500;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.08);
    }
    .btn.primary:hover {
      background: hsl(var(--primary) / 0.9);
      color: hsl(var(--primary-foreground));
    }
    .btn.primary:active { background: hsl(var(--primary) / 0.85); }
    .btn.primary .btn-icon { color: hsl(var(--primary-foreground)); }
    .btn.primary:hover .btn-icon { color: hsl(var(--primary-foreground)); }

    /* ═══════════════ 分区标题 ═══════════════ */
    .section-title {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 12px 4px 6px;
      font-size: 11px;
      font-weight: 500;
      color: hsl(var(--muted-foreground));
      letter-spacing: 0.02em;
    }
    .section-title svg { color: hsl(var(--muted-foreground)); }

    /* ═══════════════ 设置 —— 开关 ═══════════════ */
    .setting-list {
      display: flex;
      flex-direction: column;
      padding: 4px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 10px;
      border-radius: calc(var(--radius) - 4px);
      font-size: 12px;
      color: hsl(var(--foreground));
      line-height: 1.4;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .setting-item:hover { background: hsl(var(--accent)); }
    .setting-item input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    /* Switch — shadcn 风格 */
    .switch {
      position: relative;
      width: 32px;
      height: 18px;
      flex-shrink: 0;
      border-radius: 999px;
      background: hsl(var(--input));
      transition: background-color 0.2s ease;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: hsl(var(--background));
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.1), 0 1px 3px 0 rgb(0 0 0 / 0.1);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .setting-item input:checked + .switch {
      background: hsl(var(--primary));
    }
    .setting-item input:checked + .switch::after {
      transform: translateX(14px);
      background: hsl(var(--primary-foreground));
    }
    .setting-item input:focus-visible + .switch {
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring) / 0.4);
    }
    /* Select — shadcn 风格 */
    .setting-select {
      min-width: 68px;
      height: 26px;
      padding: 0 8px;
      border: 1px solid hsl(var(--input));
      border-radius: calc(var(--radius) - 4px);
      color: hsl(var(--foreground));
      background: hsl(var(--background));
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .setting-select:hover { border-color: hsl(var(--ring)); }
    .setting-select:focus-visible {
      outline: none;
      border-color: hsl(var(--ring));
      box-shadow: 0 0 0 2px hsl(var(--background)), 0 0 0 4px hsl(var(--ring) / 0.4);
    }

    /* ═══════════════ 底部提示 ═══════════════ */
    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
      color: hsl(var(--muted-foreground));
      text-align: center;
      margin-top: 10px;
      line-height: 1.5;
    }
    .hint svg { flex-shrink: 0; color: hsl(var(--muted-foreground)); }

    ::selection { background: hsl(var(--accent)); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="header card">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 128 128" role="presentation">
        <rect x="4" y="4" width="120" height="120" rx="28" fill="#202124"/>
        <path d="M38 23h35l24 24v54a6 6 0 0 1-6 6H38a7 7 0 0 1-7-7V30a7 7 0 0 1 7-7Z" fill="#FAFAF9"/>
        <path d="M73 23v18a7 7 0 0 0 7 7h17L73 23Z" fill="#F97316"/>
        <path d="M48 50h12v33h23v12H48V50Z" fill="#202124"/>
      </svg>
    </span>
    <div>
      <h1>Linux.do 工具箱</h1>
      <div class="sub">Markdown 导出与阅读辅助</div>
    </div>
  </header>

  <!-- 页面信息（由 popup.js 填充） -->
  <div class="info card" id="info">正在检测页面…</div>

  <!-- 操作按钮 -->
  <div class="btn-group">
    <button class="btn primary" id="copyTopic">
      <span class="btn-icon" aria-hidden="true">
        <!-- lucide: copy -->
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
      </span>
      <span class="btn-label">复制当前已加载楼层</span>
    </button>
    <button class="btn" id="downloadTopic">
      <span class="btn-icon" aria-hidden="true">
        <!-- lucide: download -->
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      </span>
      <span class="btn-label">下载当前已加载楼层 (.md)</span>
    </button>
  </div>

  <!-- 功能开关 -->
  <div class="section-title">
    <!-- lucide: settings-2 -->
    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
    功能开关
  </div>
  <div class="setting-list card">
    <label class="setting-item">
      <span>主题正文 / 评论双栏阅读</span>
      <input id="enableSplitReading" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="setting-item" for="commentsPerPage">
      <span>每页评论数</span>
      <select class="setting-select" id="commentsPerPage">
        <option value="10">10 条</option>
        <option value="20" selected>20 条</option>
        <option value="40">40 条</option>
      </select>
    </label>
    <label class="setting-item">
      <span>显示楼层复制 / 下载按钮</span>
      <input id="enablePostActions" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="setting-item">
      <span>启用选中文本 Base64 解码</span>
      <input id="enableBase64Decode" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="setting-item">
      <span>导出时保留来源元信息</span>
      <input id="includeMetadata" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="setting-item">
      <span>替换 upload:// 图片链接</span>
      <input id="replaceUploadUrls" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
    <label class="setting-item">
      <span>启用原生图片预览</span>
      <input id="enableNativeImagePreview" type="checkbox">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </div>

  <div class="hint">
    <!-- lucide: info -->
    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    整帖导出范围为页面当前已加载楼层
  </div>
  <script src="popup.js"></script>
</body>
</html>
